<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark Mode Todo App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      /* Custom scrollbar for a cleaner look */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #1f2937;
      }
      ::-webkit-scrollbar-thumb {
        background: #4b5563;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #6b7280;
      }
    </style>
  </head>
  <body
    class="bg-gray-900 text-gray-100 font-sans min-h-screen flex items-center justify-center p-4"
  >
    <div
      class="w-full max-w-md bg-gray-800 rounded-xl shadow-2xl border border-gray-700 p-6 backend-card"
    >
      <div class="flex justify-between items-center mb-6">
        <h1
          class="text-2xl font-bold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500"
        >
          Task Manager
        </h1>
        <span
          id="task-count"
          class="text-xs bg-gray-700 text-purple-400 px-2.5 py-1 rounded-full font-semibold"
        >
          0 Tasks
        </span>
      </div>

      <form id="todo-form" class="flex gap-2 mb-6">
        <input
          type="text"
          id="todo-input"
          placeholder="What needs to be done?"
          required
          class="flex-1 bg-gray-700 text-gray-100 placeholder-gray-400 px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 border border-transparent focus:border-transparent transition duration-200"
        />
        <button
          type="submit"
          class="bg-purple-600 hover:bg-purple-700 text-white px-5 py-3 rounded-lg font-medium transition duration-200 flex items-center justify-center gap-1 active:scale-95"
        >
          <i class="fa-solid fa-plus"></i> Add
        </button>
      </form>

      <div class="max-h-80 overflow-y-auto pr-1">
        <ul id="todo-list" class="space-y-3"></ul>
      </div>

      <div id="empty-state" class="text-center py-8 text-gray-500 hidden">
        <i class="fa-solid fa-clipboard-list text-4xl mb-2 text-gray-600"></i>
        <p>Your list is empty. Relax!</p>
      </div>
    </div>

    <script>
      // DOM Elements
      const todoForm = document.getElementById("todo-form");
      const todoInput = document.getElementById("todo-input");
      const todoList = document.getElementById("todo-list");
      const taskCount = document.getElementById("task-count");
      const emptyState = document.getElementById("empty-state");

      // Load tasks from LocalStorage or initialize empty array
      let todos = JSON.parse(localStorage.getItem("todos")) || [];

      // Application Logic
      function saveToLocalStorage() {
        localStorage.setItem("todos", JSON.stringify(todos));
      }

      function updateUI() {
        // Clear current list
        todoList.innerHTML = "";

        // Toggle empty state
        if (todos.length === 0) {
          emptyState.classList.remove("hidden");
        } else {
          emptyState.classList.add("hidden");
        }

        // Update badge count
        taskCount.innerText = `${todos.length} ${todos.length === 1 ? "Task" : "Task"}`;

        // Render list items
        todos.forEach((todo, index) => {
          const li = document.createElement("li");
          li.className = `flex items-center justify-between p-3.5 bg-gray-750 border border-gray-700 rounded-lg group hover:border-gray-600 transition duration-150 ${todo.completed ? "opacity-60" : ""}`;

          li.innerHTML = `
                    <div class="flex items-center gap-3 flex-1 min-w-0">
                        <button onclick="toggleTodo(${index})" type="button" class="w-5 h-5 rounded-md border flex items-center justify-center transition dynamic-checkbox ${todo.completed ? "bg-purple-500 border-purple-500 text-white" : "border-gray-500 hover:border-purple-400"}" aria-label="Toggle task">
                            ${todo.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ""}
                        </button>
                        <span class="truncate pr-2 ${todo.completed ? "line-through text-gray-500" : "text-gray-200"}">
                            ${escapeHTML(todo.text)}
                        </span>
                    </div>
                    <button onclick="deleteTodo(${index})" class="text-gray-500 hover:text-red-400 p-1 opacity-0 group-hover:opacity-100 focus:opacity-100 transition duration-150" aria-label="Delete task">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                `;
          todoList.appendChild(li);
        });
      }

      // Add Todo
      todoForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const text = todoInput.value.trim();
        if (!text) return;

        todos.push({ text, completed: false });
        todoInput.value = "";

        saveToLocalStorage();
        updateUI();
      });

      // Toggle Todo Completion
      window.toggleTodo = (index) => {
        todos[index].completed = !todos[index].completed;
        saveToLocalStorage();
        updateUI();
      };

      // Delete Todo
      window.deleteTodo = (index) => {
        todos.splice(index, 1);
        saveToLocalStorage();
        updateUI();
      };

      // Helper to prevent XSS/script injection attacks
      function escapeHTML(str) {
        return str.replace(
          /[&<>'"]/g,
          (tag) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              "'": "&#39;",
              '"': "&quot;",
            })[tag] || tag,
        );
      }

      // Initial setup
      updateUI();
    </script>
  </body>
</html>
