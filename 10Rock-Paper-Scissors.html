<!doctype html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles/10-rock-paper-scissors.css" />
    <style></style>
  </head>
  <body>
    <p class="play">Rock Paper Scissors</p>
    <button onclick="playGame('rock')" class="image" title="rock">
      <img class="rock-image" src="rock-emoji.png" />
    </button>
    <button onclick="playGame('paper')" class="image-paper" title="paper">
      <img class="paper-image" src="paper-emoji.png" />
    </button>
    <button
      onclick="playGame('scissors')"
      class="image-scissors"
      title="scissors"
    >
      <img class="scissors-image" src="scissors-emoji.png" />
    </button>
    <p class="js-result"></p>
    <p class="js-moves"></p>
    <p class="js-score score"></p>
    <button
      onclick="
        score.wins = 0;
        score.lose = 0;
        score.tie = 0;

        alert(`Score reset! \n wins : 0, lose : 0, tie : 0.`);
        UpdateScore();
      "
      class="reset-button"
      title="Click to reset your score"
    >
      Reset score
    </button>

    <p class="js-moves">Click here to Reset your score</p>
    <script>
      const score = {
        wins: 0,
        lose: 0,
        tie: 0,
      };
      UpdateScore();
      function playGame(playerMove) {
        const computerMove = pickComputerMove();
        let result = "";
        if (playerMove === "scissors") {
          if (computerMove === "rock") {
            result = "you lose.";
          } else if (computerMove === "paper") {
            result = "you win.";
          } else if (computerMove === "scissors") {
            result = "Tie.";
          }
        } else if (playerMove === "paper") {
          if (computerMove === "rock") {
            result = "you win.";
          } else if (computerMove === "paper") {
            result = "Tie.";
          } else if (computerMove === "scissors") {
            result = "you lose.";
          }
        } else if (playerMove === "rock") {
          if (computerMove === "rock") {
            result = "Tie.";
          } else if (computerMove === "paper") {
            result = "you lose.";
          } else if (computerMove === "scissors") {
            result = "you win.";
          }
        }
        if (result === "you win.") {
          score.wins += 1;
        } else if (result === "you lose.") {
          score.lose += 1;
        } else if (result === "Tie.") {
          score.tie += 1;
        }

        document.querySelector(".js-result").innerHTML = result;
        document.querySelector(".js-moves").innerHTML = `you
      <img src="${playerMove}-emoji.png"  class="rock-image" />.
      <img src="${computerMove}-emoji.png" class="scissors-image" /> Computer ..`;
        UpdateScore();
      }

      function UpdateScore() {
        document.querySelector(".js-score").innerHTML =
          `wins : ${score.wins}, lose : ${score.lose}, tie : ${score.tie}`;
      }

      function pickComputerMove() {
        const randomNumber = Math.random();

        let computerMove = "";

        if (randomNumber >= 0 && randomNumber < 1 / 3) {
          computerMove = "rock";
        } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
          computerMove = "paper";
        } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
          computerMove = "scissors";
        }
        return computerMove;
      }
    </script>
  </body>
</html>
