<!doctype html>
<html>
  <head>
    <title>Arrays and Loops</title>
  </head>
  <body>
    <script>
      const todoList = [
        "Buy milk",
        "Go to the gym",
        "Learn JavaScript",
        "Cook dinner",
      ];
      for (let i = 0; i < todoList.length; i++) {
        console.log(todoList[i]);
      }
    </script>
  </body>
</html>
